<!DOCTYPE html>
<html>
<head>
    <title>Hypersonic Express - Fail-Safe Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', system-ui; background: #e3f2fd; overflow: hidden; }
        #map { height: 100vh; width: 100vw; position: absolute; z-index: 1; background: #e3f2fd; }
        
        /* Fail-safe background if tiles don't load */
        .leaflet-container { background: #e3f2fd !important; }

        #ui-layer {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 12px; width: 310px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15); border: 2px solid #00aaff;
        }
        
        h2 { margin: 0 0 15px 0; color: #0077cc; text-transform: uppercase; font-size: 1.1em; letter-spacing: 2px; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .data-row { display: flex; justify-content: space-between; margin: 8px 0; border-bottom: 1px solid #f9f9f9; padding-bottom: 4px; }
        .label { color: #666; font-size: 0.7em; font-weight: bold; }
        .value { font-family: 'Courier New', monospace; font-weight: bold; color: #0077cc; font-size: 1.1em; }
        
        select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #00aaff; background: white; font-weight: 600; cursor: pointer; }
        button { 
            width: 100%; padding: 14px; margin-top: 10px; background: #00aaff; color: white; border: none; 
            border-radius: 8px; font-weight: bold; font-size: 1em; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #0088cc; }
        button:disabled { background: #ccc; }
        
        #prog-bg { width: 100%; height: 6px; background: #e0f2ff; border-radius: 3px; margin-top: 12px; overflow: hidden; }
        #prog-fill { width: 0%; height: 100%; background: #00aaff; }
    </style>
</head>
<body>

<div id="ui-layer">
    <h2>DASHBOARD</h2>
    <div class="data-row"><span class="label">LOCATION</span> <span id="loc-name" class="value">Miami, FL</span></div>
    <div class="data-row"><span class="label">LEG V-MAX</span> <span id="vmax-val" class="value">---</span> <small>MPH</small></div>
    <div class="data-row"><span class="label">LIVE SPEED</span> <span id="speed" class="value">0</span> <small>MPH</small></div>
    <div class="data-row"><span class="label">G-LOAD</span> <span id="gforce" class="value">0.00 G</span></div>
    
    <select id="jump-select"></select>
    <div id="prog-bg"><div id="prog-fill"></div></div>
    <button id="launch-btn">ENGAGE DRIVE</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const stops = [
        { name: "Miami, FL", lat: 25.7617, lon: -80.1918 }, { name: "Orlando, FL", lat: 28.5383, lon: -81.3792 },
        { name: "Jacksonville, FL", lat: 30.3322, lon: -81.6557 }, { name: "Savannah, GA", lat: 32.0809, lon: -81.0912 },
        { name: "Atlanta, GA", lat: 33.7490, lon: -84.3880 }, { name: "Chattanooga, TN", lat: 35.0456, lon: -85.3097 },
        { name: "Nashville, TN", lat: 36.1627, lon: -86.7816 }, { name: "Evansville, IN", lat: 37.9716, lon: -87.5705 },
        { name: "St. Louis, MO", lat: 38.6270, lon: -90.1994 }, { name: "Springfield, IL", lat: 39.7990, lon: -89.6462 },
        { name: "Chicago, IL", lat: 41.8781, lon: -87.6298 }, { name: "Madison, WI", lat: 43.0731, lon: -89.4012 },
        { name: "Rochester, MN", lat: 44.0121, lon: -92.4802 }, { name: "Minneapolis, MN", lat: 44.9778, lon: -93.2650 },
        { name: "Fargo, ND", lat: 46.8772, lon: -96.7898 }, { name: "Bismarck, ND", lat: 46.8083, lon: -100.7837 },
        { name: "Williston, ND", lat: 48.1470, lon: -103.6132 }, { name: "Regina, SK", lat: 50.4452, lon: -104.6189 },
        { name: "Saskatoon, SK", lat: 52.1332, lon: -106.6700 }, { name: "Lloydminster, AB", lat: 53.2785, lon: -110.0050 },
        { name: "Edmonton, AB", lat: 53.5461, lon: -113.4938 }, { name: "Whitecourt, AB", lat: 54.1439, lon: -115.6825 },
        { name: "Grande Prairie, AB", lat: 55.1708, lon: -118.7947 }, { name: "Fort St. John, BC", lat: 56.2465, lon: -120.8464 },
        { name: "Fort Nelson, BC", lat: 58.8050, lon: -122.6972 }, { name: "Muncho Lake, BC", lat: 59.0044, lon: -125.7744 },
        { name: "Watson Lake, YT", lat: 60.0637, lon: -128.7085 }, { name: "Teslin, YT", lat: 60.1683, lon: -132.7152 },
        { name: "Whitehorse, YT", lat: 60.7212, lon: -135.0568 }, { name: "Haines Junction, YT", lat: 60.7522, lon: -137.5108 },
        { name: "Tok, AK", lat: 63.3367, lon: -142.9856 }, { name: "Fairbanks, AK", lat: 64.8378, lon: -147.7164 },
        { name: "Nenana, AK", lat: 64.5639, lon: -149.0961 }, { name: "Healy, AK", lat: 63.8569, lon: -148.9664 },
        { name: "Wasilla, AK", lat: 61.5814, lon: -149.4411 }, { name: "Anchorage, AK", lat: 61.2181, lon: -149.9003 }
    ];

    const haversine = (p1, p2) => {
        const rad = x => x * Math.PI / 180;
        const R = 3958.8;
        const dLat = rad(p2.lat - p1.lat);
        const dLon = rad(p2.lon - p1.lon);
        const a = Math.sin(dLat/2)**2 + Math.cos(rad(p1.lat)) * Math.cos(rad(p2.lat)) * Math.sin(dLon/2)**2;
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    let currentIdx = 0;
    let map, trainMarker;
    const select = document.getElementById('jump-select');
    const btn = document.getElementById('launch-btn');
    const locVal = document.getElementById('loc-name');
    const speedVal = document.getElementById('speed');
    const vmaxVal = document.getElementById('vmax-val');
    const gVal = document.getElementById('gforce');
    const progVal = document.getElementById('prog-fill');

    stops.forEach((s, i) => {
        const opt = document.createElement('option');
        opt.value = i; opt.innerText = `STOP ${i+1}: ${s.name}`;
        select.appendChild(opt);
    });

    // INIT MAP WITH FALLBACK LOGIC
    map = L.map('map', { zoomControl: true, attributionControl: false }).setView([stops[0].lat, stops[0].lon], 4);
    
    // Attempt to load HD tiles
    const tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 });
    tileLayer.addTo(map);

    // If tiles fail to load, the background stays #e3f2fd (Light Blue)
    
    L.polyline(stops.map(s => [s.lat, s.lon]), {color: '#00aaff', weight: 2, opacity: 0.5}).addTo(map);
    map.createPane('topPane').style.zIndex = 650;
    trainMarker = L.circleMarker([stops[0].lat, stops[0].lon], {
        radius: 10, color: '#ffffff', fillColor: '#0077cc', fillOpacity: 1, weight: 3, pane: 'topPane'
    }).addTo(map);

    select.onchange = (e) => {
        currentIdx = parseInt(e.target.value);
        locVal.innerText = stops[currentIdx].name;
        trainMarker.setLatLng([stops[currentIdx].lat, stops[currentIdx].lon]);
        map.setView([stops[currentIdx].lat, stops[currentIdx].lon], 6);
    };

    btn.onclick = () => {
        if (currentIdx >= stops.length - 1) return;
        btn.disabled = true; select.disabled = true;
        
        const start = stops[currentIdx];
        const end = stops[currentIdx + 1];
        const dist = haversine(start, end);
        const vmax = dist * 12; 
        const accelG = (144 * dist) / 21937.4; 
        
        vmaxVal.innerText = Math.round(vmax);
        gVal.innerText = accelG.toFixed(2) + " G";

        const duration = 600000; 
        const startTime = performance.now();

        function step(now) {
            let t = (now - startTime) / duration;
            if (t >= 1) {
                currentIdx++; select.value = currentIdx;
                locVal.innerText = stops[currentIdx].name;
                speedVal.innerText = "0";
                progVal.style.width = "0%";
                btn.disabled = false; select.disabled = false;
                trainMarker.setLatLng([end.lat, end.lon]);
                return;
            }

            let p = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            let v = t <= 0.5 ? vmax * (t * 2) : vmax * (1 - (t - 0.5) * 2);

            speedVal.innerText = Math.round(v);
            progVal.style.width = (t * 100) + "%";

            const curLat = start.lat + (end.lat - start.lat) * p;
            const curLon = start.lon + (end.lon - start.lon) * p;
            trainMarker.setLatLng([curLat, curLon]);
            map.panTo([curLat, curLon], { animate: false });
            
            requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    };
</script>
</body>
</html>
